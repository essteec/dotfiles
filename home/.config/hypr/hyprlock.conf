$scripts = ~/.local/bin

$FONT = Cantarell
# $FONT = Inter
# $FONT = Fira Sans

$text = rgba(255, 255, 255, 0.8)
$subtext = rgba(200, 200, 200, 0.8)

# BACKGROUND
background {
    path = screenshot
    blur_passes = 2
    blur_size = 2
    noise = 0.02
    vibrancy = 0.3
    contrast = 1.8
    brightness = 0.5
}

general {
    no_fade_in = true
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 1000
}

# day and date
label {
    monitor =
    shadow_passes = 0
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = $subtext
    font_size = 40
    font_family = $FONT
    position = 0, 450

    halign = center
    valign = center
}
# Time
label {
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $text
    font_size = 120
    font_family = $FONT
    position = 0, 320
    halign = center
    valign = center
}

# Current Song

image {
    monitor =
    path = /tmp/lockscreen-image.png
    reload_cmd = $scripts/album-art.sh
    reload_time = 15
    crossfade_time = 5
    size = 360
    rounding = 0 # no rounding

    position = 0, 0
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:2000] $scripts/current-song.sh
    shadow_passes = 1
    color = $text
    font_size = 36
    font_family = $FONT
    position = 0, -260
    halign = center
    valign = center
}

label {
    monitor =
    onclick = exec playerctl play-pause
    text = cmd[update:2000] [[ "$(playerctl status 2>/dev/null)" == "Playing" ]] && echo "" || echo ""
    shadow_passes = 1
    color = $subtext
    font_size = 40
    font_family = $FONT
    position = 0, -360
    halign = center
    valign = center
}

# next song
label {
    monitor =
    onclick = exec playerctl next
    text = 󰒭
    shadow_passes = 1
    color = $subtext
    font_size = 40
    font_family = $FONT
    position = 160, -360
    halign = center
    valign = center
}

# prev song
label {
    monitor =
    onclick = exec playerctl previous
    text = 󰒮
    shadow_passes = 1
    color = $subtext
    font_size = 40
    font_family = $FONT
    position = -160, -360
    halign = center
    valign = center
}

# Battery Status background should be black box %50 opacity
label {
  monitor =
  text = cmd[update:5000] $scripts/battery-status.sh
  color = $text
  font_size = 24
  font_family = $FONT
  position = -10, -10
  halign = right
  valign = top
}

# Keyboard LAYOUT
label {
  monitor =
  onclick = exec hyprctl switchxkblayout main next
  text = Layout: $LAYOUT[en,tr]
  color = $text
  font_size = 16
  font_family = $FONT
  position = 10, -10
  halign = left
  valign = top
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 2, linear
}

input-field {
    size = 430, 60
    font_size = 90
    outline_thickness = 2
    dots_size = 0.24 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.24 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = $subtext
    check_color = rgb(180, 180, 180)
    caps_lock_color = rgb(255, 150, 75)
    numlock_color = rgb(200, 0, 250)
    bothlock_color = rgb(255, 100, 150)
    swap_font_color = true
    invert_numlock = true
    fade_on_empty = false
    font_family = $FONT
    placeholder_text = <i><span foreground="##ffffff99">Enter the password</span></i>
    hide_input = false
    position = 0, -450
    halign = center
    valign = center
}
