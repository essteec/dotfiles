$FONT = Cantarell Nerd Font
$FONTDATETIME = Vipnagorgialla
# $FONT = JetBrainsMono Nerd Font Mono
# $FONT = Inter
# $FONT = Fira Sans

$text = rgba(225, 225, 225, 0.8)
$subtext = rgba(175, 175, 175, 0.8)
$shadow = rgba(70, 70, 70, 0.8)

general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 1500
}

# BACKGROUND
background {
    path = screenshot
    blur_passes = 2
    blur_size = 2
    noise = 0.02
    vibrancy = 0.3
    contrast = 1.8
    brightness = 0.5
}

# day and date
label {
    monitor =
    shadow_passes = 0
    text = cmd[update:60000] echo -e "<b>$(date +"%A, %-d %B")</b>"
    color = $subtext
    font_size = 40
    font_family = $FONTDATETIME
    position = 0, 460

    halign = center
    valign = center
}
# Time
label {
    text = <b>$TIME</b>
    color = $text
    font_size = 120
    font_family = $FONTDATETIME
    position = 0, 340
    halign = center
    valign = center
}

# background blurry album art
image {
    monitor =
    path = /tmp/art-album-blur.png
    reload_time = 11
    # crossfade_time = 4

    size = 480
    rounding = 40 # no rounding
    border_size = 0

    position = 0, -160
    halign = center
    valign = center
    zindex = 1
}

# album art main
image {
    monitor =
    path = /tmp/art-album.png
    reload_cmd = album-art.sh
    reload_time = 12
    # crossfade_time = 4

    size = 300
    rounding = 0 # no rounding
    border_size = 0

    position = 0, -70
    halign = center
    valign = center
    zindex = 3
}

# Title
label {
    monitor =
    text = cmd[update:2000] music.sh --title
    color = $text
    font_size = 18
    font_family = $FONT
    position = 0, -250
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 1
    shadow_boost = 3.2
}


# Artist
label {
    monitor =
    text = cmd[update:2000] music.sh --artist
    color = $text
    font_size = 15
    font_family = $FONT
    position = 0, -280
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 1
    shadow_boost = 2.8
}


# Switch player: shows the current player, click to cycle
label {
    monitor =
    text = cmd[update:2000] music.sh --icon
    onclick = exec music.sh --do switch
    color = $text
    font_size = 22
    font_family = $FONT
    position = -110, -320
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 1
    shadow_boost = 2.8
}


# Previous
label {
    monitor =
    text = cmd[update:2000] [[ "$(music.sh --status)" == "" ]] && echo "" || echo "󰒮"
    onclick = exec music.sh --do prev
    color = $text
    font_size = 25
    font_family = $FONT
    position = -60, -320
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 1
    shadow_boost = 3.2
}


# Play / pause
label {
    monitor =
    text = cmd[update:2000] music.sh --status || echo "󰓇"
    onclick = music.sh --do toggle || hyprctl eval "hl.dispatch(hl.dsp.exec_cmd('spotify-launcher', { workspace = '99 silent' }))"
    color = $text
    font_size = 28
    font_family = $FONT
    position = 0, -320
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 1
    shadow_boost = 3.2
}

# Next
label {
    monitor =
    text = cmd[update:2000] [[ "$(music.sh --status)" == "" ]] && echo "" || echo "󰒭"
    onclick = exec music.sh --do next
    color = $text
    font_size = 25
    font_family = $FONT
    position = 60, -320
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 1
    shadow_boost = 3.2
}

# Shuffle (replaces the plus icon): empty if the player has no shuffle
label {
    monitor =
    text = cmd[update:2000] music.sh --shuffle
    onclick = exec music.sh --do shuffle
    color = $text
    font_size = 22
    font_family = $FONT
    position = 110, -320
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 1
    shadow_boost = 2.8
}

# Progress
label {
    monitor =
    text = cmd[update:1000] music.sh --progress
    color = $text
    font_size = 14
    font_family = $FONT
    position = 0, -360
    halign = center
    valign = center
    zindex = 5
}

# Battery Status
label {
  monitor =
  text = cmd[update:12000] battery-status.sh
  color = $text
  font_size = 24
  font_family = $FONT
  position = -10, -10
  halign = right
  valign = top
}

# Keyboard LAYOUT
label {
  monitor =
  onclick = exec hyprctl switchxkblayout all next
  text = Layout: $LAYOUT[en,tr]
  color = $text
  font_size = 16
  font_family = $FONT
  position = 10, -10
  halign = left
  valign = top
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 2, linear
}

input-field {
    size = 430, 60
    outline_thickness = 2
    dots_size = 0.24 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.24 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = $subtext
    check_color = rgb(180, 180, 180)
    capslock_color = rgb(255, 150, 75)
    numlock_color = rgb(200, 0, 250)
    bothlock_color = rgb(255, 100, 150)
    swap_font_color = true
    invert_numlock = true
    fade_on_empty = false
    font_family = $FONT
    placeholder_text = <i><span foreground="##ffffff99">Enter the password </span></i>
    hide_input = false
    position = 0, -460
    halign = center
    valign = center
}
