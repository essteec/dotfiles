general {
    lock_cmd = pidof hyprlock || hyprlock  # what binary to run when lock is requested
    before_sleep_cmd = loginctl lock-session  # lock before system goes to sleep
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"  # turn on display after sleep
    inhibit_sleep = 3 # wait until screen lock 
}
## lower screen brightness
listener {
    timeout = 300 # 5min

    # Save brightness set to 10%
    on-timeout = brightnessctl -s set 5%; brightnessctl -sd asus::kbd_backlight set 0
    # Restore brightness from the saved file
    on-resume = brightnessctl -r; brightnessctl -rd asus::kbd_backlight
}
## lock screen
listener {
    timeout = 600 # 10min
    on-timeout = hyprctl dispatch "hl.dsp.focus({ workspace = 'empty' })"; loginctl lock-session # lock screen when timeout has passed
}
## turn off screen
listener {
    timeout = 840 # 14min
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"# screen off when timeout has passed
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })" # screen on when activity is detected
}
## hibernate if not charging
listener {
    timeout = 960 # 16min

    # cat /sys/class/power_supply/BAT1/status
    # Discharging
    on-timeout = grep -q 'Discharging' /sys/class/power_supply/BAT1/status && systemctl hibernate
}
