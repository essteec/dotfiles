# set exact-conf or random-theme
# you can set multiple options seperated by comma. 

# exact-conf options:
# animated/: ken, rei, silvia :.conf
# aot/: levi, eren-mikasa :.conf
# catppuccin/; catppuccin-frappe, catppuccin-latte, catppuccin-macchiato, catppuccin-mocha :.conf
# demon-slayer/:  gyomei-himejima, infinity-castle-tanjiro, inosuke, nezuko-glowing-eyes, obanai-iguro, rengoku, shinobu-kocho, tanjiro-flames, tengen-uzui, zenitsu :.conf
# kiss/: sabrina, zoktay :.conf
# knight/: knight-autumn, knight-flower-right, knight-silence, knight-water-right :.conf
# main/: default, moon, rose-right :.conf
# oled/: girl-behind :.conf
# other/: chainsaw-man, everforest, nord :.conf
# rain/: rain-autumn-leaves, rain-city, raindrop, raindrops :.conf
# nfs/: mw-bmw, u2-nissan :.conf

# random-theme options:
# main: main/*
# animated: animated/*
# catppuccin: catppuccin/*
# aot: aot/*
# demon-slayer: demon-slayer/*
# knight: knight/*
# popular: oled/girl-behind.conf kiss/sabrina.conf kiss/zoktay.conf
# rain: rain/*
# nfs: nfs/*
# other: other/: everforest, nord :.conf

#   Options:
# exact-conf=main/rose-right.conf,main/moon.conf
# random-theme=demon-slayer
# all=true
# blacklist-conf=kiss/sabrina.conf,kiss/zoktay.conf
# blacklist-theme=popular

#   My minimal setup:
exact-conf=main/rose-right.conf,main/moon.conf

#   My normal setup:
# exact-conf=
# random-theme=popular,main,nfs,knight,rain
# blacklist-conf=main/default.conf
# blacklist-theme=popular

# all anime:
# random-theme=aot,demon-slayer
# exact-conf=other/chainsaw-man.conf,oled/girl-behind.conf

#   Full random setup:
# all=true
#     with some minimal blacklisted configs:
# blacklist-theme=animated,other
# blacklist-conf=catppuccin/latte.conf
#     with extended blacklist:
# blacklist-theme=animated,catppuccin,aot,demon-slayer,popular,other
# blacklist-conf=main/default.conf
