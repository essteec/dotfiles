# https://lusingander.github.io/serie/configurations/config-file-format.html
[core.option]
graph_antialias = true
graph_style = "curved"

[core.search]
ignore_case = true

[core.user_command]
commands_1 = {
  name = "delta",
  type = "suspend",
  commands = [
    "sh", "-c",
    "git --no-pager diff --color=always \"$1\" \"$2\" | delta --paging=always",
    "serie",
    "{{first_parent_hash}}",
    "{{target_hash}}"
  ]
}

[ui.list]
scrolloff = 6

# color theme below nothing else

