# Kitty Configuration File

# Themes
include themes/Monokai_Soda_v2.conf
# My favourite themes
#include themes/Monokai_Soda_v2.conf
#include themes/Molokai.conf
#include themes/PaulMillr.conf

## Font Configuration

font_family JetBrainsMono Nerd Font Mono
bod_font JetBrainsMono Nerd Font Mono Bold
italic_font JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic

font_size 12

disable_ligatures always

## Window Padding
window_padding_width 5
window_padding_height 5
dynamic_padding yes

#confirm_os_window_close 0

remember_window_size no

enable_audio_bell no

background_opacity 0.7

scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

shell zsh

# Cursor setting
#cursor_shape block
#cursor_blink_interval 0
#shell_integration no-cursor

url_color #bd8700 
url_style straight

# Shortcuts
map ctrl+shift+j launch --cwd=current --type=background thunar .
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd

# https://github.com/kovidgoyal/kitty/discussions/4447#discussioncomment-17863698
# Minimal Tab bar styling
# Add this at Bottom of Kitty.conf
tab_bar_edge                top
tab_bar_style               custom
tab_bar_custom_style        tab_bar
tab_title_template          "◌ {index}:{(f'…{title.removeprefix("~")[-24:]}' if len(title.removeprefix("~")) > 25 else title.removeprefix("~"))}{' [Q]' if layout_name == 'stack' else ''}"
tab_powerline_style         slanted
tab_separator               ""
tab_bar_min_tabs            2
tab_fade                    0 0 0 0

active_tab_title_template   "◉ {index}:{(f'…{title.removeprefix("~")[-24:]}' if len(title.removeprefix("~")) > 25 else title.removeprefix("~"))}{' [Q]' if layout_name == 'stack' else ''}"
active_tab_font_style       bold-italic

inactive_tab_font_style     normal
