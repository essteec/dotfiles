general.import = [
  #"~/.config/alacritty/catppuccin-mocha.toml"
  "~/.config/alacritty/Monokai_Soda_v2.toml"
]

[window]

padding = { x = 5, y = 5 }

decorations = "Transparent"

opacity = 0.7

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"
[colors]

[colors.primary]

background = "#000000"
